// Modifica la funzione getAnalisys esistente
function getAnalisys(JobId) {
    const Http = new XMLHttpRequest();
    const url='/getAnalisys?JobId='+JobId;
    Http.open("GET", url);
    Http.send();

    Http.onreadystatechange = function() {
        if (Http.readyState == 4) { 
            if (Http.status == 200) {
                document.getElementById(JobId).innerHTML = "";
                document.getElementById(JobId).innerHTML = Http.responseText;
                
                // ✅ NUOVO: Aggiungi pulsanti responder
                addResponderButtonsToReport(JobId);
            }
            getAnalisys_short(JobId);
        }
    }
}

// ✅ NUOVO: Funzione per aggiungere responder buttons
function addResponderButtonsToReport(jobId) {
    const reportDiv = document.getElementById(jobId);
    if (!reportDiv) return;
    
    // Crea container
    const responderContainer = document.createElement('div');
    responderContainer.id = 'responder-actions-' + jobId;
    reportDiv.appendChild(responderContainer);
    
    // Aggiungi pulsanti
    addResponderButtons(
        '{{ data.fuco.question }}',
        '{{ data.fuco.datatype }}',
        'responder-actions-' + jobId
    );
}

// Nella funzione onload, aggiungi:
function onload() {
    {% for u in data.analysis %}
        getAnalisys("{{ u.id }}");
    {% endfor %}
}

<script>
const analyzers = {{ data.analyzers|tojson }};
const observable = "{{ data.fuco.question }}";
const datatype = "{{ data.fuco.datatype }}";
const tlp = {{ data.fuco.tlp if data.fuco.tlp is defined else config.DEFAULT_TLP }};
const pap = {{ data.fuco.pap if data.fuco.pap is defined else config.DEFAULT_PAP }};

// ORDINA GLI ANALYZER ALFABETICAMENTE
analyzers.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

let submittedCount = 0;
let completedCount = 0;
const totalCount = analyzers.length;
const jobsMap = {}; // analyzer -> job_id
const loadedTaxonomies = new Set();

// Genera l'HTML per un singolo accordion item
function createAccordionItem(analyzer) {
    const analyzerId = analyzer.replace(/\./g, '_');
    return `
    <div class="accordion-item job-submitting" id="item_${analyzerId}">
        <h2 class="accordion-header" id="heading_${analyzerId}">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#collapse_${analyzerId}" 
                    aria-expanded="false">
                ${analyzer}
                <span class="loading-spinner" id="spinner_${analyzerId}"></span>
            </button>
        </h2>
        <div id="collapse_${analyzerId}" 
             class="accordion-collapse collapse" 
             data-bs-parent="#accordion_result">
            <div class="accordion-body" id="content_${analyzerId}">
                <div class="text-center">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2">In attesa di sottomissione...</p>
                </div>
            </div>
        </div>
    </div>
    `;
}

// Aggiorna il progresso
function updateProgress() {
    if (submittedCount < totalCount) {
        $('#status-text').text(`${submittedCount} / ${totalCount} job sottomessi`);
    } else if (completedCount < totalCount) {
        $('#progress-info strong').text('Analisi in corso...');
        $('#status-text').text(`${completedCount} / ${totalCount} completate`);
    } else {
        $('#progress-info').removeClass('alert-info').addClass('alert-success');
        $('#progress-info strong').text('Tutte le analisi completate!');
        $('#status-text').text('');
        checkExportReady();
    }
}

// Sottometti un singolo job
async function submitJob(analyzer) {
    const analyzerId = analyzer.replace(/\./g, '_');
    
    try {
        console.log(`Sottomissione job per ${analyzer}...`);
        
        const response = await fetch('/api/submit_job', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                analyzer: analyzer,
                datatype: datatype,
                data: observable,
                tlp: tlp,  // NUOVO: Passa TLP
                pap: pap   // NUOVO: Passa PAP
            })
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            console.log(`Job ${result.job_id} sottomesso per ${analyzer}`);
            jobsMap[analyzer] = result.job_id;
            
            submittedCount++;
            updateProgress();
            
            $(`#item_${analyzerId}`).removeClass('job-submitting');
            $(`#content_${analyzerId}`).html(`
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Analisi in corso... (Job ID: ${result.job_id})</p>
                </div>
            `);
            
            pollJob(analyzer, result.job_id);
            
        } else {
            throw new Error(result.error || 'Errore sconosciuto');
        }
        
    } catch (error) {
        console.error(`Errore sottomissione ${analyzer}:`, error);
        submittedCount++;
        completedCount++;
        updateProgress();
        
        $(`#item_${analyzerId}`).removeClass('job-submitting').addClass('job-error');
        $(`#spinner_${analyzerId}`).hide();
        $(`#content_${analyzerId}`).html(`
            <div class="alert alert-danger">
                Errore nella sottomissione: ${error.message}
            </div>
        `);
    }
}

// Polling di un job specifico
function pollJob(analyzer, jobId) {
    const analyzerId = analyzer.replace(/\./g, '_');
    let attempts = 0;
    const maxAttempts = 60;
    
    const pollInterval = setInterval(async () => {
        attempts++;
        
        if (attempts > maxAttempts) {
            clearInterval(pollInterval);
            markJobError(analyzerId, 'Timeout: analisi troppo lunga');
            return;
        }
        
        try {
            const response = await fetch(`/api/poll_job/${jobId}`);
            const result = await response.json();
            
            if (result.status === 'success') {
                clearInterval(pollInterval);
                console.log(`Job ${jobId} completato con successo`);
                
                await loadJobTaxonomies(jobId);
                await loadJobReport(analyzerId, jobId);
                
            } else if (result.status === 'failed' || result.status === 'error') {
                clearInterval(pollInterval);
                markJobError(analyzerId, result.report_status || result.error || 'Errore');
            }
            
        } catch (error) {
            clearInterval(pollInterval);
            markJobError(analyzerId, `Errore polling: ${error.message}`);
        }
        
    }, 2000);
}

// Carica il report completo di un job
async function loadJobReport(analyzerId, jobId) {
    try {
        const response = await fetch(`/getAnalisys?JobId=${jobId}`);
        const html = await response.text();
        
        $(`#content_${analyzerId}`).html(html);
        $(`#item_${analyzerId}`).addClass('job-completed');
        $(`#spinner_${analyzerId}`).hide();
        
        completedCount++;
        updateProgress();
        
    } catch (error) {
        console.error(`Errore caricamento report ${jobId}:`, error);
        markJobError(analyzerId, 'Errore nel caricamento del report');
    }
}

// Carica le taxonomies di un job
async function loadJobTaxonomies(jobId) {
    try {
        if (loadedTaxonomies.has(jobId)) {
            console.log(`Taxonomies per ${jobId} già caricate, skip`);
            return;
        }
        
        loadedTaxonomies.add(jobId);
        
        const response = await fetch(`/getShort?JobId=${jobId}`);
        const html = await response.text();
        
        if (html && html.trim() !== '') {
            $('#tagCloud').append(html);
            console.log(`Taxonomies caricate per ${jobId}`);
        }
        
    } catch (error) {
        console.error(`Errore caricamento taxonomies ${jobId}:`, error);
        loadedTaxonomies.delete(jobId);
    }
}

// Marca un job come errore
function markJobError(analyzerId, errorMsg) {
    $(`#item_${analyzerId}`).addClass('job-error');
    $(`#spinner_${analyzerId}`).hide();
    $(`#content_${analyzerId}`).html(`
        <div class="alert alert-danger">${errorMsg}</div>
    `);
    
    completedCount++;
    updateProgress();
}

// Abilita il pulsante export
function checkExportReady() {
    if (completedCount === totalCount) {
        $('#export-pdf-btn').prop('disabled', false);
    }
}

// Inizializzazione
$(document).ready(function() {
    console.log(`Rendering di ${totalCount} analyzer ordinati alfabeticamente...`);
    
    // Genera gli accordion ordinati
    const accordionHtml = analyzers.map(analyzer => createAccordionItem(analyzer)).join('');
    $('#accordion_result').html(accordionHtml);
    
    console.log(`Inizio sottomissione di ${totalCount} job...`);
    
    // Sottometti tutti i job contemporaneamente
    analyzers.forEach(analyzer => {
        submitJob(analyzer);
    });
});
</script>

<script>
// Funzione per esportare in PDF
function exportToPDF() {
    const exportBtn = $('#export-pdf-btn');
    exportBtn.prop('disabled', true);
    exportBtn.html('<i class="fas fa-spinner fa-spin"></i> Generating PDF...');
    
    const exportData = {
        observable: observable,
        datatype: datatype,
        jobs: analyzers.map(analyzer => ({
            id: jobsMap[analyzer],
            analyzer: analyzer
        })).filter(j => j.id)
    };
    
    fetch('/export/pdf', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(exportData)
    })
    .then(response => {
        if (!response.ok) throw new Error('Export failed');
        return response.blob();
    })
    .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fuco_report_${observable}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        exportBtn.prop('disabled', false);
        exportBtn.html('<i class="fas fa-file-pdf"></i> Export PDF');
        
        alert('PDF generato con successo!');
    })
    .catch(error => {
        console.error('Errore export PDF:', error);
        alert('Errore nella generazione del PDF');
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fas fa-file-pdf"></i> Export PDF';
    });
}

// Handle Enter key in login modal
document.addEventListener('DOMContentLoaded', function() {
    const loginPassword = document.getElementById('loginPassword');
    if (loginPassword) {
        loginPassword.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                submitLogin();
            }
        });
    }
    const loginUsername = document.getElementById('loginUsername');
    if (loginUsername) {
        loginUsername.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('loginPassword').focus();
            }
        });
    }
});
</script>
