    <script>
  function getCsrfToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.getAttribute('content') : '';
  }

  function namespaceReportTabs(container, suffix) {
    if (!container || !suffix) return;

    const tabLinks = container.querySelectorAll('a[data-bs-toggle="tab"], a[data-toggle="tab"]');
    if (!tabLinks.length) return;

    const getPane = (id) => {
      if (window.CSS && CSS.escape) {
        return container.querySelector(`#${CSS.escape(id)}`);
      }
      return container.querySelector(`[id="${id.replace(/"/g, '\\"')}"]`);
    };

    tabLinks.forEach((link, index) => {
      const target = link.getAttribute('data-bs-target') || link.getAttribute('href');
      if (!target || !target.startsWith('#')) return;

      const baseId = target.slice(1);
      const newId = `${baseId}-${suffix}`;
      const linkId = link.id ? `${link.id}-${suffix}` : `tab-${baseId}-${suffix}-${index}`;

      link.setAttribute('data-bs-target', `#${newId}`);
      link.setAttribute('href', `#${newId}`);
      link.setAttribute('id', linkId);
      link.setAttribute('aria-controls', newId);

      const pane = getPane(baseId);
      if (pane) {
        pane.id = newId;
        pane.setAttribute('aria-labelledby', linkId);
      }
    });
  }

// Update the existing getAnalysis function
function getAnalysis(JobId) {
    const Http = new XMLHttpRequest();
  const url='/getAnalysis?JobId='+JobId;
    Http.open("GET", url);
    Http.send();

    Http.onreadystatechange = function() {
        if (Http.readyState == 4) { 
            if (Http.status == 200) {
                document.getElementById(JobId).innerHTML = "";
                document.getElementById(JobId).innerHTML = Http.responseText;
              namespaceReportTabs(document.getElementById(JobId), JobId);
                
                // ✅ NEW: Add responder buttons
                addResponderButtonsToReport(JobId);
            }
            getAnalisys_short(JobId);
        }
    }
}

// ✅ NEW: Helper to add responder buttons
function addResponderButtonsToReport(jobId) {
    const reportDiv = document.getElementById(jobId);
    if (!reportDiv) return;
    
    // Create container
    const responderContainer = document.createElement('div');
    responderContainer.id = 'responder-actions-' + jobId;
    reportDiv.appendChild(responderContainer);
    
    // Add buttons
    addResponderButtons(
        '{{ data.fuco.question }}',
        '{{ data.fuco.datatype }}',
        'responder-actions-' + jobId
    );
}

// In the onload function, add:
function onload() {
    {% for u in data.analysis %}
        getAnalysis("{{ u.id }}");
    {% endfor %}
}

<script>
const analyzers = {{ data.analyzers|tojson }};
const observable = "{{ data.fuco.question }}";
const datatype = "{{ data.fuco.datatype }}";
const tlp = {{ data.fuco.tlp if data.fuco.tlp is defined else config.DEFAULT_TLP }};
const pap = {{ data.fuco.pap if data.fuco.pap is defined else config.DEFAULT_PAP }};

// Sort analyzers alphabetically
analyzers.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

let submittedCount = 0;
let completedCount = 0;
const totalCount = analyzers.length;
const jobsMap = {}; // analyzer -> job_id
const loadedTaxonomies = new Set();

// Build HTML for a single accordion item
function createAccordionItem(analyzer) {
    const analyzerId = analyzer.replace(/\./g, '_');
    return `
    <div class="accordion-item job-submitting" id="item_${analyzerId}">
        <h2 class="accordion-header" id="heading_${analyzerId}">
            <button class="accordion-button collapsed" type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#collapse_${analyzerId}" 
                    aria-expanded="false">
                ${analyzer}
                <span class="loading-spinner" id="spinner_${analyzerId}"></span>
            </button>
        </h2>
        <div id="collapse_${analyzerId}" 
             class="accordion-collapse collapse" 
             data-bs-parent="#accordion_result">
            <div class="accordion-body" id="content_${analyzerId}">
                <div class="text-center">
                    <div class="spinner-border text-warning" role="status"></div>
                    <p class="mt-2">Waiting for submission...</p>
                </div>
            </div>
        </div>
    </div>
    `;
}

// Update progress
function updateProgress() {
    if (submittedCount < totalCount) {
        $('#status-text').text(`${submittedCount} / ${totalCount} jobs submitted`);
    } else if (completedCount < totalCount) {
        $('#progress-info strong').text('Analysis in progress...');
        $('#status-text').text(`${completedCount} / ${totalCount} completed`);
    } else {
        $('#progress-info').removeClass('alert-info').addClass('alert-success');
        $('#progress-info strong').text('All analyses completed!');
        $('#status-text').text('');
        checkExportReady();
    }
}

// Submit a single job
async function submitJob(analyzer) {
    const analyzerId = analyzer.replace(/\./g, '_');
    
    try {
        console.log(`Submitting job for ${analyzer}...`);
        
        const response = await fetch('/api/submit_job', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCsrfToken()
          },
            body: JSON.stringify({
                analyzer: analyzer,
                datatype: datatype,
                data: observable,
                tlp: tlp,  // NEW: Pass TLP
                pap: pap   // NEW: Pass PAP
            })
        });
        
        const result = await response.json();
        
        if (result.status === 'success') {
            console.log(`Job ${result.job_id} submitted for ${analyzer}`);
            jobsMap[analyzer] = result.job_id;
            
            submittedCount++;
            updateProgress();
            
            $(`#item_${analyzerId}`).removeClass('job-submitting');
            $(`#content_${analyzerId}`).html(`
                <div class="text-center">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Analysis in progress... (Job ID: ${result.job_id})</p>
                </div>
            `);
            
            pollJob(analyzer, result.job_id);
            
        } else {
          throw new Error(result.error || 'Unknown error');
        }
        
    } catch (error) {
        console.error(`Submission error for ${analyzer}:`, error);
        submittedCount++;
        completedCount++;
        updateProgress();
        
        $(`#item_${analyzerId}`).removeClass('job-submitting').addClass('job-error');
        $(`#spinner_${analyzerId}`).hide();
        $(`#content_${analyzerId}`).html(`
            <div class="alert alert-danger">
                Submission error: ${error.message}
            </div>
        `);
    }
}

// Poll a specific job
function pollJob(analyzer, jobId) {
    const analyzerId = analyzer.replace(/\./g, '_');
    let attempts = 0;
    const maxAttempts = 60;
    
    const pollInterval = setInterval(async () => {
        attempts++;
        
        if (attempts > maxAttempts) {
            clearInterval(pollInterval);
            markJobError(analyzerId, 'Timeout: analysis is taking too long');
            return;
        }
        
        try {
            const response = await fetch(`/api/poll_job/${jobId}`);
            const result = await response.json();
            
            if (result.status === 'success') {
                clearInterval(pollInterval);
                console.log(`Job ${jobId} completed successfully`);
                
                await loadJobTaxonomies(jobId);
                await loadJobReport(analyzerId, jobId);
                
            } else if (result.status === 'failed' || result.status === 'error') {
                clearInterval(pollInterval);
                markJobError(analyzerId, result.report_status || result.error || 'Error');
            }
            
        } catch (error) {
            clearInterval(pollInterval);
            markJobError(analyzerId, `Polling error: ${error.message}`);
        }
        
    }, 2000);
}

// Load the full report for a job
async function loadJobReport(analyzerId, jobId) {
    try {
        const response = await fetch(`/getAnalysis?JobId=${jobId}`);
        const html = await response.text();
        
        $(`#content_${analyzerId}`).html(html);
    namespaceReportTabs(document.getElementById(`content_${analyzerId}`), jobId);
        $(`#item_${analyzerId}`).addClass('job-completed');
        $(`#spinner_${analyzerId}`).hide();
        
        completedCount++;
        updateProgress();
        
    } catch (error) {
        console.error(`Error loading report ${jobId}:`, error);
        markJobError(analyzerId, 'Error loading the report');
    }
}

// Load job taxonomies
async function loadJobTaxonomies(jobId) {
    try {
        if (loadedTaxonomies.has(jobId)) {
            console.log(`Taxonomies for ${jobId} already loaded, skipping`);
            return;
        }
        
        loadedTaxonomies.add(jobId);
        
        const response = await fetch(`/getShort?JobId=${jobId}`);
        const html = await response.text();
        
        if (html && html.trim() !== '') {
            $('#tagCloud').append(html);
            console.log(`Taxonomies loaded for ${jobId}`);
        }
        
    } catch (error) {
        console.error(`Error loading taxonomies ${jobId}:`, error);
        loadedTaxonomies.delete(jobId);
    }
}

// Mark a job as error
function markJobError(analyzerId, errorMsg) {
    $(`#item_${analyzerId}`).addClass('job-error');
    $(`#spinner_${analyzerId}`).hide();
    $(`#content_${analyzerId}`).html(`
        <div class="alert alert-danger">${errorMsg}</div>
    `);
    
    completedCount++;
    updateProgress();
}

// Enable the export button
function checkExportReady() {
    if (completedCount === totalCount) {
        $('#export-pdf-btn').prop('disabled', false);
    }
}

// Initialization
$(document).ready(function() {
    console.log(`Rendering ${totalCount} analyzers in alphabetical order...`);
    
    // Build ordered accordions
    const accordionHtml = analyzers.map(analyzer => createAccordionItem(analyzer)).join('');
    $('#accordion_result').html(accordionHtml);
    
    console.log(`Starting submission of ${totalCount} jobs...`);
    
    // Submit all jobs in parallel
    analyzers.forEach(analyzer => {
        submitJob(analyzer);
    });
});
</script>

<script>
// Funzione per esportare in PDF
function exportToPDF() {
    const exportBtn = $('#export-pdf-btn');
    exportBtn.prop('disabled', true);
    exportBtn.html('<i class="fas fa-spinner fa-spin"></i> Generating PDF...');
    
    const exportData = {
        observable: observable,
        datatype: datatype,
        jobs: analyzers.map(analyzer => ({
            id: jobsMap[analyzer],
            analyzer: analyzer
        })).filter(j => j.id)
    };
    
    fetch('/export/pdf', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCsrfToken()
      },
        body: JSON.stringify(exportData)
    })
    .then(response => {
        if (!response.ok) throw new Error('Export failed');
        return response.blob();
    })
    .then(blob => {
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fuco_report_${observable}.pdf`;
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
        
        exportBtn.prop('disabled', false);
        exportBtn.html('<i class="fas fa-file-pdf"></i> Export PDF');
        
        alert('PDF generated successfully!');
    })
    .catch(error => {
        console.error('PDF export error:', error);
        alert('Error generating the PDF');
        exportBtn.disabled = false;
        exportBtn.innerHTML = '<i class="fas fa-file-pdf"></i> Export PDF';
    });
}

// Handle Enter key in login modal
document.addEventListener('DOMContentLoaded', function() {
    const loginPassword = document.getElementById('loginPassword');
    if (loginPassword) {
        loginPassword.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {

                submitLogin();
            }
        });
    }
    const loginUsername = document.getElementById('loginUsername');
    if (loginUsername) {
        loginUsername.addEventListener('keypress', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                document.getElementById('loginPassword').focus();
            }
        });
    }
});
</script>
