
<!doctype html>
<html lang="en" class="h-100">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FUCO - Nessun report trovato</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
    
    <style>
      body { background-color: #f2f2f2; }
      .bg-fuco { 
        border-radius: 3px; 
        box-shadow: 0px 8px 20px 0px rgba(0, 0, 0, 0.15);
        background: #ffd700;
      }
      .no-reports-container {
        text-align: center;
        padding: 60px 20px;
      }
      .no-reports-icon {
        font-size: 5rem;
        color: #ffc107;
        margin-bottom: 20px;
      }
    </style>
    <link href="/css/sticky-footer-navbar.css" rel="stylesheet">
  </head>
  <body class="d-flex flex-column h-100">
    
<header>
  <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-fuco">
    <div class="container-fluid">
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-md-0">
          <li class="nav-item">
            <a class="nav-link active" href="/"><strong>Fuco</strong></a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main class="flex-shrink-0">
  <div class="container">
    <div class="no-reports-container">
      <div class="no-reports-icon">
        <i class="fas fa-search"></i>
      </div>
      
      <h2>Nessun report trovato</h2>
      
      <p class="lead mt-3">
        Non sono stati trovati report esistenti per:
      </p>
      
      <div class="alert alert-warning d-inline-block" style="max-width: 600px;">
        <strong>{{ observable }}</strong>
        <br>
        <small class="text-muted">({{ datatype }})</small>
      </div>
      
      <p class="mt-4">
        Questo osservabile non è mai stato analizzato o i report sono scaduti dalla cache di Cortex.
      </p>
      
      <div class="mt-5">
        <a href="/?q={{ observable }}&t={{ datatype }}" class="btn btn-primary btn-lg">
          <i class="fas fa-search"></i>
          Avvia una nuova analisi
        </a>
        
        <a href="/" class="btn btn-secondary btn-lg ms-2">
          <i class="fas fa-home"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>
</main>

<footer class="footer mt-auto py-3 bg-light">
  <div class="container">
    <span class="text-muted">
      <a href="https://github.com/lucamemini/fuco" target="_blank">Fuco</a> 
      By <a href="mailto:luca@memini.it">Luca Memini</a>
    </span>
  </div>
</footer>

</body>
</html>
